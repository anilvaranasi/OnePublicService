name: dev - Build and Deploy to ServiceNow DEV

# Triggered when you push your local mydev branch to origin/dev
# Flow: mydev (local) -> git push origin mydev:dev -> this pipeline
on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate now.config.json
        run: |
          node -e "
            const cfg = require('./now.config.json');
            if (!cfg.scope || !cfg.scopeId || !cfg.name) {
              console.error('Missing required metadata in now.config.json');
              process.exit(1);
            }
            console.log('now.config.json:', cfg.name, '(' + cfg.scope + ')');
          "

      - name: Build Fluent SDK package
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-dev
          path: dist/
          retention-days: 1

  deploy-dev:
    name: Deploy to ServiceNow DEV
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist-dev
          path: dist/

      - name: Authenticate now-sdk to DEV
        run: |
          echo "${{ secrets.SN_DEV_PASS }}" | npx now-sdk auth \
            --add "${{ secrets.SN_DEV_INSTANCE }}" \
            --type basic \
            --alias dev \
            --username "${{ secrets.SN_DEV_USER }}" \
            --password-stdin

      - name: Deploy to ServiceNow DEV
        run: npm run deploy -- --auth dev
