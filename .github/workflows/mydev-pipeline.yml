name: mydev - Build and Playwright

# Triggered when you push your local changes to origin/mydev.
# Builds the app and runs Playwright (placeholder for now - always passes).
# Nothing is deployed to ServiceNow from this branch.
# Next step: merge/push mydev to dev to publish the app (dev-pipeline.yml).
on:
  push:
    branches: [mydev]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate now.config.json
        run: |
          node -e "
            const cfg = require('./now.config.json');
            if (!cfg.scope || !cfg.scopeId || !cfg.name) {
              console.error('Missing required metadata in now.config.json');
              process.exit(1);
            }
            console.log('now.config.json:', cfg.name, '(' + cfg.scope + ')');
          "

      - name: Build Fluent SDK package
        run: npm run build

  playwright:
    name: Playwright E2E (placeholder)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Playwright placeholder - always passes
        run: echo "Playwright tests not configured yet - placeholder step passes."
