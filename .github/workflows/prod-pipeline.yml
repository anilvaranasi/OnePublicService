name: prod - Build and Deploy to ServiceNow PROD

# Triggered when you push the dev branch to origin/prod
# Flow: dev (local) -> git push origin dev:prod -> this pipeline
on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate now.config.json
        run: |
          node -e "
            const cfg = require('./now.config.json');
            if (!cfg.scope || !cfg.scopeId || !cfg.name) {
              console.error('Missing required metadata in now.config.json');
              process.exit(1);
            }
            console.log('now.config.json:', cfg.name, '(' + cfg.scope + ')');
          "

      - name: Build Fluent SDK package
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist-prod
          path: dist/
          retention-days: 7

  deploy-prod:
    name: Deploy to ServiceNow PROD
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist-prod
          path: dist/

      - name: Authenticate now-sdk to PROD
        run: |
          echo "${{ secrets.SN_PROD_PASS }}" | npx now-sdk auth \
            --add "${{ secrets.SN_PROD_INSTANCE }}" \
            --type basic \
            --alias prod \
            --username "${{ secrets.SN_PROD_USER }}" \
            --password-stdin

      - name: Deploy to ServiceNow PROD
        run: npm run deploy -- --auth prod
